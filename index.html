<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Automático de Bultos</title>
    <style>
        html, body { overscroll-behavior: none; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .setup-box, .prendas-box, .manip-box { margin-bottom: 20px; background: #e1dfdd; padding: 15px; border-radius: 4px; text-align: center; }
        .prendas-box { background: #fff4ce; border: 2px solid #ffaa44; display: none; }
        .manip-box { background: #e8f0fe; border: 2px solid #0078d4; display: none; text-align: left; }
        .manip-box h3 { text-align: center; margin-top: 0; }
        .manip-list { max-height: 260px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; background: white; margin-bottom: 10px; }
        .manip-item { padding: 12px 14px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 16px; }
        .manip-item:last-child { border-bottom: none; }
        .manip-item:hover, .manip-item:active { background: #f0f6fc; }
        .counter { font-size: 26px; font-weight: bold; text-align: center; margin: 15px 0; color: #0078d4; }
        .manip-actual { text-align: center; font-size: 20px; font-weight: 700; color: #333; margin-top: -8px; margin-bottom: 12px; }
        .bottom-counter { background-color: #f0f6fc; border: 2px solid #0078d4; color: #005a9e; padding: 12px; font-size: 20px; font-weight: bold; text-align: center; border-radius: 6px; margin-top: 15px; }
        .productividad { background-color: #eaf7ea; border: 2px solid #107c10; color: #0b5c0b; padding: 10px; font-size: 16px; font-weight: bold; text-align: center; border-radius: 6px; margin-top: 8px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 15px; font-size: 18px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 4px; outline: none; margin-top: 5px; }
        input[type="text"]:focus, input[type="number"]:focus { border-color: #0078d4; }
        .alert { background-color: #d83b01; color: white; padding: 15px; font-weight: bold; font-size: 15px; border-radius: 4px; margin-top: 15px; display: none; text-align: center; word-break: break-all; }
        .success { background-color: #107c10; color: white; padding: 10px; font-weight: bold; border-radius: 4px; margin-top: 10px; display: none; text-align: center; }
        .prendas-editable { color: #0078d4; text-decoration: underline; cursor: pointer; font-weight: 600; padding: 2px 4px; }
        .prendas-editable:hover { background: #eaf3fc; border-radius: 3px; }
        .btn { margin-top:10px; width:100%; background:#0078d4; color:white; border:none; padding:12px; font-size:16px; border-radius:4px; cursor:pointer; }
        .btn:hover { background: #005a9e; }
        .btn-secundario { background:#5c6673; }
        .btn-secundario:hover { background:#454d57; }
        .btn-peligro { background:#a80000; }
        .btn-peligro:hover { background:#7a0000; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:999; padding:20px; }
        .modal-box { background:white; border-radius:8px; padding:20px; max-width:420px; width:100%; }
        .modal-box h3 { margin-top:0; color:#a80000; }
        .modal-box ul { list-style: disc; padding-left: 22px; margin-bottom: 16px; }
        .modal-box li { display:list-item; border-bottom:none; padding:3px 0; font-size:15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Bultos</h2>

    <!-- Paso 1: Identificación del operario -->
    <div class="setup-box" id="setupBox">
        <label for="operarioInput"><strong>Identifícate para empezar:</strong></label><br>
        <input type="text" id="operarioInput" placeholder="Escanea o escribe tu ID de Operario..." autocomplete="off">
        <button class="btn" onclick="guardarOperario()">Comenzar Turno</button>
        <button class="btn" style="margin-top:8px; background:#6f42c1;" onclick="abrirCalidad()">Calidad</button>
    </div>

    <!-- Paso 2: Selección de manipulación (inicial o por cambio) -->
    <input type="text" id="manipSearchInput" placeholder="Buscar manipulación..." style="width:100%; padding:12px; font-size:16px; border:2px solid #ccc; border-radius:4px; margin-bottom:10px; box-sizing:border-box;" autocomplete="off">
    <div class="manip-box" id="manipBox">
        <h3>Selecciona la manipulación</h3>
        <div class="manip-list" id="manipList">
            <div style="padding:14px; text-align:center; color:#666;">Cargando listado...</div>
        </div>
        <button class="btn btn-secundario" id="cancelarManipBtn" style="display:none;" onclick="cerrarSelectorManipulacion()">Cancelar</button>
    </div>

    <!-- Panel de trabajo del escáner -->
    <div id="scannerSection" style="display:none;">
        <div class="counter" id="contador">Operario: <span id="lblOperario"></span></div>
        <div class="manip-actual">Manipulación actual: <strong id="lblManipulacionActual">-</strong></div>

        <div id="divEscaneo">
            <div id="cajaMediasBox" style="text-align:left; margin-bottom:10px;">
                <label style="display:flex; align-items:center; gap:8px; font-size:15px;">
                    <input type="checkbox" id="cajaMediasCheckbox" style="width:20px; height:20px;">
                    Caja a medias
                </label>
            </div>
            <input type="text" id="codeinput" placeholder="Dispara aquí el bulto..." autocomplete="off">
        </div>

        <div id="divPrendas" class="prendas-box">
            <h3 style="margin-top:0; color:#333;">Bulto leído: <span id="lblCodigoActual" style="color:#0078d4;"></span></h3>
            <label for="prendasInput"><strong>Número de prendas (Opcional):</strong></label><br>
            <input type="number" id="prendasInput" placeholder="Dejar en blanco si no aplica..." min="1" autocomplete="off">
            <button class="btn" style="background:#107c10;" onclick="enviarDatos(prendasInput.value)">Guardar Bulto</button>
        </div>

        <div id="successBox" class="success">¡Bulto guardado correctamente en la nube!</div>
        <div id="alertBox" class="alert">¡ATENCIÓN! Error.</div>

        <!-- Solo se muestra el último bulto guardado, editable -->
        <div id="ultimoBultoBox" style="display:none; background:#fafafa; border:1px solid #ddd; border-radius:4px; padding:10px 14px; margin-top:15px; font-size:15px;">
            <span class="info" id="ultimoBultoInfo"></span>
        </div>

        <div style="display:flex; gap:8px; margin-top:15px;">
            <div class="bottom-counter" id="bottomCounter" style="margin-top:0; flex:1; font-size:15px; padding:10px 6px;">Bultos: 0</div>
            <div class="bottom-counter" id="prendasCounter" style="margin-top:0; flex:1; font-size:15px; padding:10px 6px; background-color:#fff4ce; border-color:#ffaa44; color:#8a5a00;">Prendas: 0</div>
        </div>
        <div class="productividad" id="productividadBox">Productividad: 0,0 prendas/hora</div>

        <button class="btn btn-secundario" style="margin-top:15px;" onclick="abrirCambioManipulacion()">Cambiar Manipulación</button>
        <button class="btn" id="descansoBtn" style="margin-top:8px; background:#5c6673;" onclick="toggleDescanso()">Iniciar Descanso</button>
        <button class="btn btn-peligro" tabindex="-1" onclick="cambiarOperario()">Finalizar / Cambiar Operario</button>
    </div>
</div>

<!-- Modal de Calidad: comprobar y corregir prendas de cualquier bulto -->
<div class="modal-overlay" id="calidadModal">
    <div class="modal-box">
        <h3 style="color:#6f42c1;">Calidad: comprobar bulto</h3>
        <input type="text" id="calidadCodigoInput" placeholder="Escanea el código del bulto..." autocomplete="off" style="margin-bottom:10px;">
        <div id="calidadResultado" style="font-size:15px; margin-bottom:10px;"></div>
        <button class="btn btn-secundario" onclick="cerrarCalidad()">Cerrar</button>
    </div>
</div>

<!-- Modal de recordatorios al elegir manipulación -->
<div class="modal-overlay" id="recordatoriosModal">
    <div class="modal-box">
        <h3>Antes de empezar, ten en cuenta:</h3>
        <ul id="recordatoriosLista"></ul>
        <button class="btn" onclick="confirmarManipulacionSeleccionada()">Entendido, empezar</button>
    </div>
</div>

<script>
    // === URLs de los flujos de Power Automate ===
    const FLOW_URL = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/4b4df6e183d1416fbb15abeb8a5736ee/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xePCUuDh1Bf9M19Bq8XrBpoZzkChw7PeGm50K8Fq6PU";
    const FLOW_URL_EDITAR = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/215b8689c35d46e489b8ebc1a9683ca2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=43G-UsBvFyeY8wNZmPw8oNurUYq5lVxXXnmwb72S4UI";
    const FLOW_URL_MANIPULACIONES = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/9f4ee7bb146c4bb89128a1d26819a783/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ozOXFbMUbsrHLlNyP9pBuiVzW2iv24zbwEj9gfSy9Vc";
    const FLOW_URL_COMPROBAR = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/6b1a7900cc964c869bd27082251d6fc5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=w_BwywyIB_PROhrkEu1J68h7WaYgY_vfezi4iV5pVKQ";
    const FLOW_URL_SESION_INICIO = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/77e5897eaf494f229bfe0e3494e0c9d3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GiL52Ip1FyODK2cefAg0__-Dws2ysXTymNSO5Nx-Odc";
    const FLOW_URL_SESION_FIN = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/d14828a681324753b681a52e4d71e660/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jaqEFLD223k6t2qadslVsEWcFng89wucRxVv9-dsxWQ";
    const FLOW_URL_DETALLE = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/50ddece195704456b14e66f2ae8e41da/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=nsbxnyd4HWO4ibcWKoyMdjTLIYJBbZd29TbNa8cHcPI";

    let sesionActualId = null;

    async function iniciarSesion(nombreManipulacion) {
        try {
            const r = await fetch(FLOW_URL_SESION_INICIO, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ operario: operarioActual, manipulacion: nombreManipulacion })
            });
            const data = await r.json();
            sesionActualId = data.id;
        } catch (e) { console.error('No se pudo iniciar sesión', e); }
    }

    async function finalizarSesionActual() {
        if (!sesionActualId) return;
        const idParaCerrar = sesionActualId;
        sesionActualId = null;
        try {
            await fetch(FLOW_URL_SESION_FIN, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id: idParaCerrar })
            });
        } catch (e) { console.error('No se pudo cerrar sesión', e); }
    }

    let operarioActual = "";
    let manipulacionActual = "";
    let manipulacionPendienteSeleccion = null; // {codigo, recordatorio}
    let esCambioDeManipulacion = false;
    let codigoPendiente = "";
    let totalBultos = 0;
    let totalPrendasGlobal = 0;
    const bultosSesion = new Set(); // solo para feedback inmediato; el bloqueo real lo hace el flujo

    // Productividad: se acumula desde que se seleccionó/cambió de manipulación
    let inicioManipulacionTs = null;
    let prendasManipulacion = 0;
    let productividadTimer = null;

    // Descanso: el tiempo en pausa no cuenta para la productividad
    let enDescanso = false;
    let pausaInicioTs = null;
    let pausaAcumuladaMs = 0;

    const setupBox = document.getElementById('setupBox');
    const manipBox = document.getElementById('manipBox');
    const manipList = document.getElementById('manipList');
    const cancelarManipBtn = document.getElementById('cancelarManipBtn');
    const
