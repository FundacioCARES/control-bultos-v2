<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Automático de Bultos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .setup-box, .prendas-box, .manip-box { margin-bottom: 20px; background: #e1dfdd; padding: 15px; border-radius: 4px; text-align: center; }
        .prendas-box { background: #fff4ce; border: 2px solid #ffaa44; display: none; }
        .manip-box { background: #e8f0fe; border: 2px solid #0078d4; display: none; text-align: left; }
        .manip-box h3 { text-align: center; margin-top: 0; }
        .manip-list { max-height: 260px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; background: white; margin-bottom: 10px; }
        .manip-item { padding: 12px 14px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 16px; }
        .manip-item:last-child { border-bottom: none; }
        .manip-item:hover, .manip-item:active { background: #f0f6fc; }
        .counter { font-size: 26px; font-weight: bold; text-align: center; margin: 15px 0; color: #0078d4; }
        .manip-actual { text-align: center; font-size: 20px; font-weight: 700; color: #333; margin-top: -8px; margin-bottom: 12px; }
        .bottom-counter { background-color: #f0f6fc; border: 2px solid #0078d4; color: #005a9e; padding: 12px; font-size: 20px; font-weight: bold; text-align: center; border-radius: 6px; margin-top: 15px; }
        .productividad { background-color: #eaf7ea; border: 2px solid #107c10; color: #0b5c0b; padding: 10px; font-size: 16px; font-weight: bold; text-align: center; border-radius: 6px; margin-top: 8px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 15px; font-size: 18px; box-sizing: border-box; border: 2px solid #ccc; border-radius: 4px; outline: none; margin-top: 5px; }
        input[type="text"]:focus, input[type="number"]:focus { border-color: #0078d4; }
        .alert { background-color: #d83b01; color: white; padding: 15px; font-weight: bold; font-size: 15px; border-radius: 4px; margin-top: 15px; display: none; text-align: center; word-break: break-all; }
        .success { background-color: #107c10; color: white; padding: 10px; font-weight: bold; border-radius: 4px; margin-top: 10px; display: none; text-align: center; }
        .prendas-editable { color: #0078d4; text-decoration: underline; cursor: pointer; font-weight: 600; padding: 2px 4px; }
        .prendas-editable:hover { background: #eaf3fc; border-radius: 3px; }
        .btn { margin-top:10px; width:100%; background:#0078d4; color:white; border:none; padding:12px; font-size:16px; border-radius:4px; cursor:pointer; }
        .btn:hover { background: #005a9e; }
        .btn-secundario { background:#5c6673; }
        .btn-secundario:hover { background:#454d57; }
        .btn-peligro { background:#a80000; }
        .btn-peligro:hover { background:#7a0000; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:999; padding:20px; }
        .modal-box { background:white; border-radius:8px; padding:20px; max-width:420px; width:100%; }
        .modal-box h3 { margin-top:0; color:#a80000; }
        .modal-box ul { list-style: disc; padding-left: 22px; margin-bottom: 16px; }
        .modal-box li { display:list-item; border-bottom:none; padding:3px 0; font-size:15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Bultos</h2>

    <!-- Paso 1: Identificación del operario -->
    <div class="setup-box" id="setupBox">
        <label for="operarioInput"><strong>Identifícate para empezar:</strong></label><br>
        <input type="text" id="operarioInput" placeholder="Escanea o escribe tu ID de Operario..." autocomplete="off">
        <button class="btn" onclick="guardarOperario()">Comenzar Turno</button>
        <button class="btn" style="margin-top:8px; background:#6f42c1;" onclick="abrirCalidad()">Calidad</button>
    </div>

    <!-- Paso 2: Selección de manipulación (inicial o por cambio) -->
    <input type="text" id="manipSearchInput" placeholder="Buscar manipulación..." style="width:100%; padding:12px; font-size:16px; border:2px solid #ccc; border-radius:4px; margin-bottom:10px; box-sizing:border-box;" autocomplete="off">
    <div class="manip-box" id="manipBox">
        <h3>Selecciona la manipulación</h3>
        <div class="manip-list" id="manipList">
            <div style="padding:14px; text-align:center; color:#666;">Cargando listado...</div>
        </div>
        <button class="btn btn-secundario" id="cancelarManipBtn" style="display:none;" onclick="cerrarSelectorManipulacion()">Cancelar</button>
    </div>

    <!-- Panel de trabajo del escáner -->
    <div id="scannerSection" style="display:none;">
        <div class="counter" id="contador">Operario: <span id="lblOperario"></span></div>
        <div class="manip-actual">Manipulación actual: <strong id="lblManipulacionActual">-</strong></div>

        <div id="divEscaneo">
            <input type="text" id="codeinput" placeholder="Dispara aquí el bulto..." autocomplete="off">
        </div>

        <div id="divPrendas" class="prendas-box">
            <h3 style="margin-top:0; color:#333;">Bulto leído: <span id="lblCodigoActual" style="color:#0078d4;"></span></h3>
            <div id="cajaMediasBox" style="text-align:left; margin:10px 0;">
                <label style="display:flex; align-items:center; gap:8px; font-size:15px;">
                    <input type="checkbox" id="cajaMediasCheckbox" style="width:20px; height:20px;">
                    Caja a medias
                </label>
            </div>
            <label for="prendasInput"><strong>Número de prendas (Opcional):</strong></label><br>
            <input type="number" id="prendasInput" placeholder="Dejar en blanco si no aplica..." min="1" autocomplete="off">
            <button class="btn" style="background:#107c10;" onclick="enviarDatos(prendasInput.value)">Guardar Bulto</button>
        </div>

        <div id="successBox" class="success">¡Bulto guardado correctamente en la nube!</div>
        <div id="alertBox" class="alert">¡ATENCIÓN! Error.</div>

        <!-- Solo se muestra el último bulto guardado, editable -->
        <div id="ultimoBultoBox" style="display:none; background:#fafafa; border:1px solid #ddd; border-radius:4px; padding:10px 14px; margin-top:15px; font-size:15px;">
            <span class="info" id="ultimoBultoInfo"></span>
        </div>

        <div style="display:flex; gap:8px; margin-top:15px;">
            <div class="bottom-counter" id="bottomCounter" style="margin-top:0; flex:1; font-size:15px; padding:10px 6px;">Bultos: 0</div>
            <div class="bottom-counter" id="prendasCounter" style="margin-top:0; flex:1; font-size:15px; padding:10px 6px; background-color:#fff4ce; border-color:#ffaa44; color:#8a5a00;">Prendas: 0</div>
        </div>
        <div class="productividad" id="productividadBox">Productividad: 0,0 prendas/hora</div>

        <button class="btn btn-secundario" style="margin-top:15px;" onclick="abrirCambioManipulacion()">Cambiar Manipulación</button>
        <button class="btn" id="descansoBtn" style="margin-top:8px; background:#5c6673;" onclick="toggleDescanso()">Iniciar Descanso</button>
        <button class="btn btn-peligro" tabindex="-1" onclick="cambiarOperario()">Finalizar / Cambiar Operario</button>
    </div>
</div>

<!-- Modal de Calidad: comprobar y corregir prendas de cualquier bulto -->
<div class="modal-overlay" id="calidadModal">
    <div class="modal-box">
        <h3 style="color:#6f42c1;">Calidad: comprobar bulto</h3>
        <input type="text" id="calidadCodigoInput" placeholder="Escanea el código del bulto..." autocomplete="off" style="margin-bottom:10px;">
        <div id="calidadResultado" style="font-size:15px; margin-bottom:10px;"></div>
        <button class="btn btn-secundario" onclick="cerrarCalidad()">Cerrar</button>
    </div>
</div>

<!-- Modal de recordatorios al elegir manipulación -->
<div class="modal-overlay" id="recordatoriosModal">
    <div class="modal-box">
        <h3>Antes de empezar, ten en cuenta:</h3>
        <ul id="recordatoriosLista"></ul>
        <button class="btn" onclick="confirmarManipulacionSeleccionada()">Entendido, empezar</button>
    </div>
</div>

<script>
    // === URLs de los flujos de Power Automate ===
    const FLOW_URL = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/4b4df6e183d1416fbb15abeb8a5736ee/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xePCUuDh1Bf9M19Bq8XrBpoZzkChw7PeGm50K8Fq6PU";
    const FLOW_URL_EDITAR = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/215b8689c35d46e489b8ebc1a9683ca2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=43G-UsBvFyeY8wNZmPw8oNurUYq5lVxXXnmwb72S4UI";
    const FLOW_URL_MANIPULACIONES = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/9f4ee7bb146c4bb89128a1d26819a783/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ozOXFbMUbsrHLlNyP9pBuiVzW2iv24zbwEj9gfSy9Vc";
    const FLOW_URL_COMPROBAR = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/6b1a7900cc964c869bd27082251d6fc5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=w_BwywyIB_PROhrkEu1J68h7WaYgY_vfezi4iV5pVKQ";
    const FLOW_URL_SESION_INICIO = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/13/workflows/77e5897eaf494f229bfe0e3494e0c9d3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=GiL52Ip1FyODK2cefAg0__-Dws2ysXTymNSO5Nx-Odc";
    const FLOW_URL_SESION_FIN = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/d14828a681324753b681a52e4d71e660/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jaqEFLD223k6t2qadslVsEWcFng89wucRxVv9-dsxWQ";
    const FLOW_URL_DETALLE = "https://default77fff5221e97410bbfa71c6a072137.c8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/50ddece195704456b14e66f2ae8e41da/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=nsbxnyd4HWO4ibcWKoyMdjTLIYJBbZd29TbNa8cHcPI";

    let sesionActualId = null;

    async function iniciarSesion(nombreManipulacion) {
        try {
            const r = await fetch(FLOW_URL_SESION_INICIO, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ operario: operarioActual, manipulacion: nombreManipulacion })
            });
            const data = await r.json();
            sesionActualId = data.id;
        } catch (e) { console.error('No se pudo iniciar sesión', e); }
    }

    async function finalizarSesionActual() {
        if (!sesionActualId) return;
        const idParaCerrar = sesionActualId;
        sesionActualId = null;
        try {
            await fetch(FLOW_URL_SESION_FIN, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id: idParaCerrar })
            });
        } catch (e) { console.error('No se pudo cerrar sesión', e); }
    }

    let operarioActual = "";
    let manipulacionActual = "";
    let manipulacionPendienteSeleccion = null; // {codigo, recordatorio}
    let esCambioDeManipulacion = false;
    let codigoPendiente = "";
    let totalBultos = 0;
    let totalPrendasGlobal = 0;
    const bultosSesion = new Set(); // solo para feedback inmediato; el bloqueo real lo hace el flujo

    // Productividad: se acumula desde que se seleccionó/cambió de manipulación
    let inicioManipulacionTs = null;
    let prendasManipulacion = 0;
    let productividadTimer = null;

    // Descanso: el tiempo en pausa no cuenta para la productividad
    let enDescanso = false;
    let pausaInicioTs = null;
    let pausaAcumuladaMs = 0;

    // Caja a medias: permite repetir un bulto ya existente si lo escanea otro operario, sumando prendas
    let cajaMediasExistente = false;
    let prendasExistentesCajaMedias = 0;

    const setupBox = document.getElementById('setupBox');
    const manipBox = document.getElementById('manipBox');
    const manipList = document.getElementById('manipList');
    const cancelarManipBtn = document.getElementById('cancelarManipBtn');
    const scannerSection = document.getElementById('scannerSection');
    const operarioInput = document.getElementById('operarioInput');
    const lblOperario = document.getElementById('lblOperario');
    const lblManipulacionActual = document.getElementById('lblManipulacionActual');
    const inputField = document.getElementById('codeinput');
    const divEscaneo = document.getElementById('divEscaneo');
    const divPrendas = document.getElementById('divPrendas');
    const lblCodigoActual = document.getElementById('lblCodigoActual');
    const prendasInput = document.getElementById('prendasInput');
    const ultimoBultoBox = document.getElementById('ultimoBultoBox');
    const ultimoBultoInfo = document.getElementById('ultimoBultoInfo');
    const bottomCounter = document.getElementById('bottomCounter');
    const prendasCounter = document.getElementById('prendasCounter');
    const productividadBox = document.getElementById('productividadBox');
    const alertBox = document.getElementById('alertBox');
    const successBox = document.getElementById('successBox');
    const recordatoriosModal = document.getElementById('recordatoriosModal');
    const recordatoriosLista = document.getElementById('recordatoriosLista');

    window.onload = function() {
        operarioInput.focus();
    };

    operarioInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            guardarOperario();
        }
    });

    function guardarOperario() {
        const id = operarioInput.value.trim();
        if (!id) {
            alert("Por favor, introduce un ID de operario válido.");
            return;
        }
        operarioActual = id;
        lblOperario.textContent = id;
        setupBox.style.display = 'none';
        esCambioDeManipulacion = false;
        abrirSelectorManipulacion();
    }

    // ---------- Selección / cambio de manipulación ----------

    let manipulacionesData = [];

    async function abrirSelectorManipulacion() {
        manipBox.style.display = 'block';
        cancelarManipBtn.style.display = esCambioDeManipulacion ? 'block' : 'none';
        document.getElementById('manipSearchInput').value = '';
        manipList.innerHTML = `<div style="padding:14px; text-align:center; color:#666;">Cargando listado...</div>`;

        try {
            const response = await fetch(FLOW_URL_MANIPULACIONES, {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            if (!response.ok) throw new Error(`Código ${response.status}`);
            const data = await response.json();

            if (!Array.isArray(data) || data.length === 0) {
                manipList.innerHTML = `<div style="padding:14px; text-align:center; color:#a80000;">No se ha podido cargar el listado.</div>`;
                return;
            }
            manipulacionesData = data;
            renderManipList(data);
        } catch (error) {
            manipList.innerHTML = `<div style="padding:14px; text-align:center; color:#a80000;">Error cargando manipulaciones: ${error.message}</div>`;
        }
    }

    function renderManipList(data) {
        manipList.innerHTML = '';
        if (data.length === 0) {
            manipList.innerHTML = `<div style="padding:14px; text-align:center; color:#666;">Sin resultados.</div>`;
            return;
        }
        data.forEach(m => {
            const div = document.createElement('div');
            div.className = 'manip-item';
            div.textContent = m.codigo;
            div.onclick = () => seleccionarManipulacion(m.codigo, m.recordatorio || '');
            manipList.appendChild(div);
        });
    }

    document.getElementById('manipSearchInput').addEventListener('input', (e) => {
        const texto = e.target.value.toLowerCase();
        const filtrado = manipulacionesData.filter(m => m.codigo.toLowerCase().includes(texto));
        renderManipList(filtrado);
    });

    function seleccionarManipulacion(codigo, recordatorio) {
        manipulacionPendienteSeleccion = codigo;
        recordatoriosLista.innerHTML = '';
        const lineas = (recordatorio || '').split('\n').map(l => l.trim()).filter(l => l.length > 0);

        if (lineas.length === 0) {
            confirmarManipulacionSeleccionada();
            return;
        }
        lineas.forEach(linea => {
            const li = document.createElement('li');
            li.textContent = linea;
            recordatoriosLista.appendChild(li);
        });
        recordatoriosModal.style.display = 'flex';
    }

    function confirmarManipulacionSeleccionada() {
        finalizarSesionActual().then(() => iniciarSesion(manipulacionPendienteSeleccion));
        recordatoriosModal.style.display = 'none';
        manipulacionActual = manipulacionPendienteSeleccion;
        lblManipulacionActual.textContent = manipulacionActual;

        // Reinicia el contador de productividad para la nueva manipulación
        inicioManipulacionTs = Date.now();
        prendasManipulacion = 0;
        enDescanso = false;
        pausaInicioTs = null;
        pausaAcumuladaMs = 0;
        const descansoBtn = document.getElementById('descansoBtn');
        if (descansoBtn) { descansoBtn.textContent = 'Iniciar Descanso'; descansoBtn.style.background = '#5c6673'; }
        actualizarProductividad();
        if (productividadTimer) clearInterval(productividadTimer);
        productividadTimer = setInterval(actualizarProductividad, 30000);

        manipBox.style.display = 'none';
        scannerSection.style.display = 'block';
        divEscaneo.style.display = 'block';
        divPrendas.style.display = 'none';
        inputField.focus();
    }

    function abrirCambioManipulacion() {
        esCambioDeManipulacion = true;
        scannerSection.style.display = 'none';
        abrirSelectorManipulacion();
    }

    function cerrarSelectorManipulacion() {
        manipBox.style.display = 'none';
        scannerSection.style.display = 'block';
        inputField.focus();
    }

    function actualizarProductividad() {
        if (!inicioManipulacionTs) return;
        const ahora = Date.now();
        const pausaEnCurso = (enDescanso && pausaInicioTs) ? (ahora - pausaInicioTs) : 0;
        const msTrabajados = (ahora - inicioManipulacionTs) - pausaAcumuladaMs - pausaEnCurso;
        const horas = Math.max(msTrabajados, 0) / 3600000;
        const productividad = horas > 0 ? (prendasManipulacion / horas) : 0;
        productividadBox.textContent = `Productividad (${manipulacionActual}): ${productividad.toFixed(1)} prendas/hora`;
    }

    function toggleDescanso() {
        const btn = document.getElementById('descansoBtn');
        if (!enDescanso) {
            enDescanso = true;
            pausaInicioTs = Date.now();
            inputField.disabled = true;
            btn.textContent = 'Reanudar (en descanso)';
            finalizarSesionActual().then(() => iniciarSesion('DESCANSO'));
            btn.style.background = '#ffaa44';
        } else {
            enDescanso = false;
            pausaAcumuladaMs += (Date.now() - pausaInicioTs);
            pausaInicioTs = null;
            inputField.disabled = false;
            inputField.focus();
            btn.textContent = 'Iniciar Descanso';
            finalizarSesionActual().then(() => iniciarSesion(manipulacionActual));
            btn.style.background = '#5c6673';
            actualizarProductividad();
        }
    }

    function cambiarOperario() {
        if (confirm("¿Seguro que deseas finalizar la sesión de este operario?")) {
            finalizarSesionActual();
            location.reload();
        }
    }

    // Mantener el foco en el campo de lectura de bultos
    document.addEventListener('click', (e) => {
        if (e.target.closest && (e.target.closest('#ultimoBultoBox') || e.target.closest('#calidadModal'))) return; // no interferir en edición de prendas ni en Calidad
        if (scannerSection.style.display !== 'none' && divPrendas.style.display === 'none') {
            inputField.focus();
        }
    });

    // Guardián: fuerza el foco al campo correcto antes de que cualquier tecla
    // (incluida una perdida de la pistola) pueda llegar a otro elemento
    document.addEventListener('keydown', function(e) {
        if (enDescanso) return; // en descanso no se fuerza el foco al escáner
        if (document.activeElement && ['inputEdicionPrendas', 'calidadCodigoInput', 'calidadManipInput', 'calidadPrendasInput'].includes(document.activeElement.id)) return; // no interferir mientras se edita o se usa Calidad
        let campoCorrecto;
        if (setupBox.style.display !== 'none') {
            campoCorrecto = operarioInput;
        } else if (divPrendas.style.display === 'block') {
            campoCorrecto = prendasInput;
        } else if (scannerSection.style.display !== 'none') {
            campoCorrecto = inputField;
        } else {
            return; // pantalla de selección de manipulación: no forzar foco
        }
        if (document.activeElement !== campoCorrecto) {
            campoCorrecto.focus();
        }
    }, true);

    // Filtro estricto para ignorar comandos extra de la pistola al leer el bulto
    inputField.addEventListener('keydown', async function(event) {
        if (event.key.startsWith('F') && event.key.length > 1) { event.preventDefault(); return; }

        if (event.key === 'Enter') {
            event.preventDefault();
            const codigo = inputField.value.trim();
            if (!codigo) return;
            inputField.value = '';
            alertBox.style.display = 'none';
            successBox.style.display = 'none';

            if (!/^\d{20}$/.test(codigo)) {
                alertBox.textContent = "Código no válido: debe tener 20 dígitos.";
                alertBox.style.display = 'block';
                playBeep(150);
                return;
            }

            let detalle = null;
            try {
                const resp = await fetch(FLOW_URL_DETALLE, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ codigo })
                });
                detalle = await resp.json();
            } catch (e) {
                // si falla la comprobación previa, seguimos igualmente; el guardado final es quien de verdad protege
            }

            cajaMediasExistente = false;
            prendasExistentesCajaMedias = 0;
            const cajaMediasCheckboxEl = document.getElementById('cajaMediasCheckbox');
            cajaMediasCheckboxEl.checked = false;

            if (detalle && detalle.encontrado) {
                if (detalle.operario === operarioActual) {
                    alertBox.textContent = "Este bulto ya ha sido registrado.";
                    alertBox.style.display = 'block';
                    playBeep(150);
                    return;
                }
                cajaMediasExistente = true;
                prendasExistentesCajaMedias = parseFloat(detalle.prendas) || 0;
            }

            codigoPendiente = codigo;
            lblCodigoActual.textContent = codigo;
            divEscaneo.style.display = 'none';
            divPrendas.style.display = 'block';
            prendasInput.value = '';
            prendasInput.focus();
        }
    });

    prendasInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            enviarDatos(prendasInput.value);
        }
    });

    async function enviarDatos(numPrendas) {
        if (cajaMediasExistente) {
            const cajaMediasCheckboxEl = document.getElementById('cajaMediasCheckbox');
            if (!cajaMediasCheckboxEl.checked) {
                divPrendas.style.display = 'none';
                divEscaneo.style.display = 'block';
                alertBox.textContent = "Este bulto ya ha sido registrado.";
                alertBox.style.display = 'block';
                playBeep(150);
                cajaMediasExistente = false;
                prendasExistentesCajaMedias = 0;
                codigoPendiente = "";
                inputField.focus();
                return;
            }
            await enviarDatosCajaMedias(numPrendas);
            return;
        }

        divPrendas.style.display = 'none';
        divEscaneo.style.display = 'block';

        try {
            const response = await fetch(FLOW_URL, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    operario: operarioActual,
                    codigo: codigoPendiente,
                    manipulacion: manipulacionActual,
                    prendas: numPrendas ? numPrendas : "",
                    fecha: new Date().toISOString()
                })
            });

            if (response.status === 409) {
                // Duplicado detectado en el servidor
                alertBox.textContent = "Este bulto ya ha sido registrado.";
                alertBox.style.display = 'block';
                playBeep(150);
            } else if (response.ok) {
                bultosSesion.add(codigoPendiente);
                totalBultos++;
                totalPrendasGlobal += parseFloat(numPrendas) || 0;
                prendasCounter.textContent = `Prendas: ${totalPrendasGlobal}`;

                const prendasNum = parseFloat(numPrendas) || 0;
                prendasManipulacion += prendasNum;
                actualizarProductividad();

                successBox.textContent = "¡Bulto guardado correctamente en la nube!";
                agregarFilaHistorial(codigoPendiente, numPrendas);

                bottomCounter.textContent = `Bultos: ${totalBultos}`;
                successBox.style.display = 'block';
                playBeep(600);
            } else {
                throw new Error(`Código ${response.status}`);
            }
        } catch (error) {
            alertBox.textContent = "Error al guardar en la nube: " + error.message;
            alertBox.style.display = 'block';
            playBeep(100);
        }

        codigoPendiente = "";
        inputField.focus();
    }

    async function enviarDatosCajaMedias(numPrendas) {
        divPrendas.style.display = 'none';
        divEscaneo.style.display = 'block';

        const prendasAnadidas = parseFloat(numPrendas) || 0;
        const totalPrendasBulto = prendasExistentesCajaMedias + prendasAnadidas;

        try {
            const response = await fetch(FLOW_URL_EDITAR, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    operario: operarioActual,
                    codigo: codigoPendiente,
                    fecha: new Date().toISOString(),
                    prendas: String(totalPrendasBulto)
                })
            });
            if (!response.ok) throw new Error(`Código ${response.status}`);

            totalBultos++;
            totalPrendasGlobal += prendasAnadidas;
            prendasCounter.textContent = `Prendas: ${totalPrendasGlobal}`;

            prendasManipulacion += prendasAnadidas;
            actualizarProductividad();

            successBox.textContent = `¡Caja a medias actualizada! Ahora tiene ${totalPrendasBulto} prendas en total.`;
            agregarFilaHistorial(codigoPendiente, totalPrendasBulto);

            bottomCounter.textContent = `Bultos: ${totalBultos}`;
            successBox.style.display = 'block';
            playBeep(600);
        } catch (error) {
            alertBox.textContent = "Error al guardar en la nube: " + error.message;
            alertBox.style.display = 'block';
            playBeep(100);
        }

        document.getElementById('cajaMediasCheckbox').checked = false;
        cajaMediasExistente = false;
        prendasExistentesCajaMedias = 0;
        codigoPendiente = "";
        inputField.focus();
    }

    function renderInfoHtml(codigo, prendas) {
        const texto = prendas ? prendas : 'añadir';
        return `${codigo} (<span class="prendas-editable" title="Tocar para editar">${texto}</span> prendas) - [Guardado]`;
    }

    function engancharClickPrendas(contenedor, infoSpan) {
        const span = infoSpan.querySelector('.prendas-editable');
        if (span) span.addEventListener('click', () => iniciarEdicionPrendas(contenedor, infoSpan));
    }

    // Solo se muestra y se puede editar el ÚLTIMO bulto guardado
    function agregarFilaHistorial(codigo, prendas) {
        ultimoBultoBox.style.display = 'block';
        ultimoBultoBox.dataset.codigo = codigo;
        ultimoBultoBox.dataset.prendas = prendas || '';
        ultimoBultoInfo.innerHTML = renderInfoHtml(codigo, prendas);
        engancharClickPrendas(ultimoBultoBox, ultimoBultoInfo);
    }

    // Edición en línea: al tocar el número de prendas del último bulto guardado
    function iniciarEdicionPrendas(contenedor, infoSpan) {
        const codigo = contenedor.dataset.codigo;
        const prendasActuales = contenedor.dataset.prendas || '';

        infoSpan.innerHTML = '';
        infoSpan.appendChild(document.createTextNode(codigo + ' ('));

        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.pattern = '[0-9]*';
        input.id = 'inputEdicionPrendas';
        input.value = prendasActuales;
        input.style.cssText = 'width:70px; padding:4px; font-size:14px; display:inline-block; margin:0 4px;';
        infoSpan.appendChild(input);

        infoSpan.appendChild(document.createTextNode(' prendas) '));

        const confirmarBtn = document.createElement('button');
        confirmarBtn.textContent = 'OK';
        confirmarBtn.style.cssText = 'padding:4px 10px; font-size:13px; cursor:pointer;';
        confirmarBtn.onclick = () => guardarEdicionPrendas(contenedor, infoSpan, input.value);
        infoSpan.appendChild(confirmarBtn);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                guardarEdicionPrendas(contenedor, infoSpan, input.value);
            }
        });

        input.focus();
        input.select();
    }

    async function guardarEdicionPrendas(contenedor, infoSpan, nuevoValor) {
        const codigo = contenedor.dataset.codigo;
        const valorAnterior = parseFloat(contenedor.dataset.prendas) || 0;

        try {
            const response = await fetch(FLOW_URL_EDITAR, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    operario: operarioActual,
                    codigo: codigo,
                    fecha: new Date().toISOString(),
                    prendas: nuevoValor
                })
            });

            if (!response.ok) throw new Error(`Código ${response.status}`);

            const valorNuevo = parseFloat(nuevoValor) || 0;
            prendasManipulacion += (valorNuevo - valorAnterior);
            totalPrendasGlobal += (valorNuevo - valorAnterior);
            prendasCounter.textContent = `Prendas: ${totalPrendasGlobal}`;
            actualizarProductividad();

            contenedor.dataset.prendas = nuevoValor || '';
            infoSpan.innerHTML = renderInfoHtml(codigo, nuevoValor);
            engancharClickPrendas(contenedor, infoSpan);
            playBeep(600);
        } catch (error) {
            alert("No se pudo actualizar: " + error.message);
            infoSpan.innerHTML = renderInfoHtml(codigo, contenedor.dataset.prendas);
            engancharClickPrendas(contenedor, infoSpan);
        }
    }

    // ---------- Calidad: comprobar y corregir prendas de cualquier bulto ----------

    function abrirCalidad() {
        document.getElementById('calidadCodigoInput').value = '';
        document.getElementById('calidadResultado').innerHTML = '';
        document.getElementById('calidadModal').style.display = 'flex';
        setTimeout(() => document.getElementById('calidadCodigoInput').focus(), 50);
    }

    function cerrarCalidad() {
        document.getElementById('calidadModal').style.display = 'none';
        if (operarioActual) {
            inputField.focus();
        } else {
            operarioInput.focus();
        }
    }

    async function asegurarManipulacionesCargadas() {
        if (manipulacionesData.length > 0) return;
        try {
            const response = await fetch(FLOW_URL_MANIPULACIONES, {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const data = await response.json();
            if (Array.isArray(data)) manipulacionesData = data;
        } catch (e) {
            // si falla, el desplegable de Calidad saldrá vacío; se puede reintentar en el siguiente escaneo
        }
    }

    document.getElementById('calidadCodigoInput').addEventListener('keydown', async function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            const codigo = this.value.trim();
            if (!codigo) return;
            this.value = ''; // se vacía para poder escanear el siguiente bulto
            const resultadoBox = document.getElementById('calidadResultado');
            resultadoBox.innerHTML = 'Buscando...';
            try {
                await asegurarManipulacionesCargadas();
                const resp = await fetch(FLOW_URL_DETALLE, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ codigo })
                });
                const data = await resp.json();
                if (!data.encontrado) {
                    resultadoBox.innerHTML = '<span style="color:#a80000;">Bulto no encontrado.</span>';
                } else {
                    mostrarResultadoCalidad(codigo, data);
                }
            } catch (e) {
                resultadoBox.innerHTML = '<span style="color:#a80000;">Error al consultar: ' + e.message + '</span>';
            }
            setTimeout(() => this.focus(), 50);
        }
    });

    function mostrarResultadoCalidad(codigo, data) {
        const resultadoBox = document.getElementById('calidadResultado');
        const opciones = manipulacionesData.map(m =>
            `<option value="${m.codigo}" ${m.codigo === data.manipulacion ? 'selected' : ''}>${m.codigo}</option>`
        ).join('');
        resultadoBox.innerHTML = `
            <div><strong>Código:</strong> ${codigo}</div>
            <div><strong>Operario:</strong> ${data.operario || '-'}</div>
            <div><strong>Fecha:</strong> ${data.fecha || '-'}</div>
            <div style="margin-top:8px;"><strong>Manipulación:</strong><br>
                <select id="calidadManipInput" style="width:100%; padding:6px; font-size:14px; margin-top:4px; box-sizing:border-box;">
                    <option value="">-- Selecciona --</option>
                    ${opciones}
                </select>
            </div>
            <div style="margin-top:8px;"><strong>Prendas:</strong>
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="calidadPrendasInput" value="${data.prendas || ''}" style="width:80px; padding:6px; font-size:14px; margin-left:6px;">
            </div>
            <button id="calidadGuardarBtn" style="margin-top:10px; padding:8px 16px; font-size:14px; cursor:pointer;">Guardar cambios</button>
        `;
        document.getElementById('calidadGuardarBtn').onclick = () => guardarCambiosCalidad(codigo);
    }

    async function guardarCambiosCalidad(codigo) {
        const nuevasPrendas = document.getElementById('calidadPrendasInput').value;
        const nuevaManipulacion = document.getElementById('calidadManipInput').value;
        try {
            const response = await fetch(FLOW_URL_EDITAR, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    operario: operarioActual,
                    codigo: codigo,
                    fecha: new Date().toISOString(),
                    prendas: nuevasPrendas,
                    manipulacion: nuevaManipulacion
                })
            });
            if (!response.ok) throw new Error(`Código ${response.status}`);
            document.getElementById('calidadResultado').insertAdjacentHTML('beforeend', '<div style="color:#107c10; margin-top:6px;">Actualizado correctamente.</div>');
            playBeep(600);
            document.getElementById('calidadCodigoInput').focus();
        } catch (error) {
            alert("No se pudo actualizar: " + error.message);
        }
    }

    function playBeep(freq) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            setTimeout(() => osc.stop(), 150);
        } catch(e) {}
    }
</script>
